en and the lights keep failing.`,`Guards fled in a hurry — their coffee is still warm.`,`A mutant in an orange jumpsuit is dragging a mop bucket around, out of habit.`,`Sprinklers have flooded the floor and the drains are gurgling.`,`The tannoy keeps repeating: "Subjects must remain in their cells."`,`Someone has painted arrows on the walls. They all point downwards.`,`Food trays are scattered everywhere — the mutants ate the trays too.`,`The emergency lockdown sealed every door except the ones it shouldn't have.`,`You can hear the guards' radios crackling from behind locked doors.`,`Toxic green slime is leaking through the ceiling tiles.`],files:[`INMATE LOG: "Subject 77 — no reaction to Mutagen-X after 40 doses. Keep isolated."`,`GUARD MEMO: "Do NOT open cell 77 without Dr. Voss present."`,`TRANSFER SLIP: Subjects 70–76 moved to Research Wing. Subject 77: HOLD.`,`Scribbled on a bunk: "They take one of us every night. Nobody comes back the same."`,`SHIFT REPORT: "Mutation spreading faster than predicted. Request evacuation." — DENIED.`,`A photo of a smiling scientist. On the back: "M. Voss — Head of Research".`,`MAINTENANCE NOTE: "Drains connect to the Under-Tunnels. Keep them locked."`,`WRISTBAND MANUAL: "Subject bands open nothing. Staff bands open everything."`,`A child's drawing taped inside a locker: a green monster and the word "DAD".`,`MEDICAL CHART: "77 — blood shows unusual antibodies. Sample flagged ULTRA."`,`NOTICE: "The Syndicate thanks you for your silence."`,`A torn page: "…if they ever find out what 77 is, they will tear this place apart to keep it."`],beats:{1:`You wake up on a cold metal bunk. Your wristband reads SUBJECT 77. The cell door is open… and the corridor outside is crawling with mutants.`,5:`A crackling radio voice: "Subject 77? If you can hear me, I can help you get out. Call me Doc." Who is this?`,25:`You find your own file. Half of it is redacted. The only clear line: "PRIORITY ASSET — DO NOT LOSE."`,45:`Doc on the radio: "The Warden has sealed the cell block. You'll have to go through him — or around him."`},bosses:[`Warden Grubb`,`Sergeant Snarl`,`The Laundry Lurker`,`Mess-Hall Mauler`,`Chief Jailer Krull`]},{n:2,name:`Research Wing`,color:`#3acc8a`,theme:`lab`,blurb:`Glass labs full of bubbling experiments. Who is Dr. Mara Voss — and why are all her notes about you?`,places:[`Lab 1: Genetics`,`Specimen Storage`,`Microscope Room`,`Clean Room`,`Lecture Theatre`,`Dr. Voss's Office`,`Chemical Store`,`Incubator Bay`,`Lab 7: Restricted`,`Data Centre`],situations:[`Test tubes are fizzing on every bench and the air smells of burnt sugar.`,`A specimen tank has cracked; something has definitely got out.`,`The fume hoods are howling and every screen shows the same error.`,`Sticky notes cover the walls — equations, warnings and a doodle of a frog.`,`The clean room's air-lock cycles open and shut on its own.`,`Lab mice have mutated into lab… well, not mice any more.`,`Centrifuges spin unattended, rattling the whole floor.`,`A hologram of Dr. Voss repeats a lecture to an empty room.`,`Biohazard bins are tipped over and the floor glows faintly.`,`Somebody barricaded the lab door — from the inside.`],files:[`LAB REPORT 12-B: "Mutagen-X turns tissue green within minutes. Side effect: appetite."`,`VOSS JOURNAL: "77 is different. The mutagen simply… gives up."`,`MEMO FROM THE DIRECTOR: "Results by Friday or the project moves to Containment Omega."`,`PATENT DRAFT: "Mutagen-X — for agricultural use." Someone has crossed out "agricultural".`,`INVENTORY: 400 litres of Mutagen-X shipped to "Orbital Site". Why orbit?`,`VOSS JOURNAL: "If 77's antibodies can be copied, we could reverse everything."`,`SECURITY FOOTAGE STILL: a figure in a white coat carrying a cooler out of Lab 7.`,`EMAIL: "Mara, stop asking questions. — The Director"`,`A whiteboard: "PROJECT REGEN — STATUS: HOPEFUL" with a smiley face.`,`TEST RESULTS: Subjects 70–76 — 100% mutation. Subject 77 — 0%.`,`A lab coat with the name tag "M. VOSS" — the pocket holds a cracked key card.`,`VOSS AUDIO LOG: "If anything happens to me, get 77 out. Whatever it takes."`],beats:{1:`The Research Wing. Doc whispers: "Dr. Voss ran this place. Find her notes — they're the key to everything."`,15:`You find Dr. Voss's office ransacked. Her desk calendar has today circled: "Move 77 to Orbital Site."`,33:`A hidden lab: rows of samples labelled "77". They have been collecting your blood for years.`,49:`Lab 7 is sealed and something huge is pacing behind the glass. Doc: "That's Specimen Zero-Two. Don't let it see you."`},bosses:[`Professor Goo`,`The Glass Crawler`,`Doctor Stitches`,`The Incubator`,`Specimen Zero-Two`]},{n:3,name:`The Under-Tunnels`,color:`#6a9a4a`,theme:`sewer`,blurb:`Down in the sewers the mutants have built a nest. They are not as mindless as they look…`,places:[`Overflow Chamber`,`Pump Station`,`The Big Pipe`,`Rat King's Hall`,`Sludge Junction`,`Maintenance Shaft`,`Old Tram Tunnel`,`Grate Maze`,`The Nest`,`Flood Gate`],situations:[`Murky water sloshes around your ankles and something just brushed past.`,`The mutants have stacked junk into strange little towers. Almost like… art.`,`Pipes groan overhead and drip glowing goo.`,`A rusty tram sits on its side, full of mutant nests.`,`Torches made from glow-sticks line the tunnel. Who lit them?`,`The pump station hums; if it stops, the tunnels flood.`,`Graffiti in mutant scrawl: "WE WERE STAFF".`,`Rats the size of dogs scurry away from you — they're scared of something worse.`,`A collapsed tunnel forces you through the drains.`,`The smell is truly, truly awful.`],files:[`STAFF BADGE (muddy): "Ken — Canteen". The mutant wearing it is still guarding the kitchen pipe.`,`MAINTENANCE LOG: "Workers report hearing singing in the tunnels at night."`,`A mutant has scratched the Helix logo into the wall and drawn a big X over it.`,`EVAC PLAN: "Staff exposed to Mutagen-X are to be sealed underground. Do not attempt rescue."`,`A wedding ring on a string, hung like a treasure in a mutant nest.`,`DOC ON THE RADIO: "They were people, 77. Every single one."`,`PUMP MANUAL page: "Main valve codes are kept in the overflow office."`,`A child's backpack full of glowing pebbles. Someone was collecting them.`,`MINUTES OF MEETING: "Test the mutagen on the night shift. Nobody will notice."`,`A mutant leaves a can of beans by the drain for you. Then runs away.`,`SURVEY MAP: tunnels lead to the Hydroponics Dome — and much deeper.`,`VOSS NOTE (water-stained): "The antibodies in 77 can turn them back. I'm sure of it."`],beats:{1:`The only way forward is down. The tunnels are dark, wet and full of eyes.`,12:`A mutant blocks your path… then points you towards a hidden drain and walks away. Did it just help you?`,27:`You find the night-shift roster. Every name on it is now a mutant in these tunnels. They were the staff.`,47:`Doc: "The Rat Queen guards the flood gate. She's been down here the longest — and she's angry."`},bosses:[`Sludge Boss Murk`,`The Pipe Snake`,`Rat Queen Gnasha`,`Old Tram Terror`,`The Drain King`]},{n:4,name:`Hydroponics Dome`,color:`#8acc3a`,theme:`garden`,blurb:`A jungle of mutant plants grown to feed the experiments. Something enormous is growing in the middle.`,places:[`Seedling Nursery`,`Tomato Terraces`,`Fungus Farm`,`Irrigation Hub`,`Bee Habitat`,`Compost Hall`,`Glass Canopy`,`Root Cellar`,`Pollen Lab`,`Central Bloom`],situations:[`Vines have smashed through the glass and are slowly crawling towards you.`,`Giant tomatoes thud to the floor. One of them blinked.`,`Mushrooms puff clouds of sparkly spores whenever you walk past.`,`The sprinklers spray green-tinted water — it's laced with mutagen.`,`Mutant bees the size of footballs buzz lazily around.`,`Roots have cracked the floor tiles and tangled the doors.`,`Everything here grows a little bit every time you look away.`,`Grow lamps flicker purple and pink across the canopy.`,`The compost heap is breathing.`,`Pollen fills the air like golden snow.`],files:[`GROWTH CHART: Mutagen-X makes crops 40× bigger. And hungry.`,`GARDENER'S DIARY: "The big flower in the middle hums at night. It knows my name."`,`MEMO: "Feed Specimen Bloom only Mutagen-X. No fertiliser. No sunlight. No mercy."`,`SEED PACKET labelled "GREEN DAWN — for global distribution".`,`IRRIGATION SCHEDULE: tanks route straight to the Reactor Core.`,`VOSS JOURNAL: "The plants are the delivery system. The Syndicate wants to seed the planet."`,`A bee-keeper's veil, chewed to pieces.`,`LAB NOTE: "77's blood stops the plants mutating. We need more blood."`,`CHECKLIST: Cryo Vault — check Subjects 1 to 76. Subject 78 — PREPARE.`,`A pressed flower in a notebook, still glowing faintly.`,`DOC ON THE RADIO: "Subject 78? I… I don't know what that is. Keep moving."`,`SHIPPING LABEL: "Bloom pollen ×12 crates — destination: ORBIT".`],beats:{1:`The tunnels open into a vast glass dome full of monstrous plants. Doc: "Careful. The plants here eat mutants."`,18:`You learn the Syndicate's plan: Operation Green Dawn — spread mutant pollen across the whole world.`,32:`A lab note mentions a Subject 78. Doc goes very quiet on the radio.`,48:`The Central Bloom stirs. Its roots run through the whole dome — and it has noticed you.`},bosses:[`Thornback`,`Queen Buzzbee`,`The Mushroom Mob`,`Rootgrip`,`The Central Bloom`]},{n:5,name:`Cryo Vault`,color:`#8adfff`,theme:`cryo`,blurb:`Frozen pods line the walls: Subjects 1 to 76. Why is your pod empty… and why is there a 78?`,places:[`Pod Hall A`,`Frost Corridor`,`Coolant Pumps`,`Thaw Chamber`,`Ice Archive`,`Sample Freezer`,`Glacier Lab`,`Pod Hall B`,`Deep Freeze`,`Vault Core`],situations:[`Your breath turns to fog and the floor is slippery with frost.`,`Rows of frozen pods hum — some of the mutants inside are twitching.`,`Icicles hang from the ceiling and crash down without warning.`,`The coolant pipes hiss, filling rooms with freezing mist.`,`A thawed-out mutant shivers and sneezes. It looks embarrassed.`,`Frozen footprints lead to a pod marked "77". It's empty.`,`Every screen shows a countdown labelled "THAW PROTOCOL".`,`The cold makes the lights flicker blue.`,`A pod labelled "78" is glowing. Something inside is awake.`,`Snow is falling — indoors.`],files:[`POD REGISTER: Subjects 1–76 — frozen after mutation. Subject 77 — RELEASED FOR STUDY.`,`CRYO LOG: "Subject 78 grown from 77's cells. Rapid growth. Unstable."`,`VOSS JOURNAL: "They made a copy of 77 — but they filled it with Mutagen-X. It's a weapon."`,`FROST-BITTEN NOTE: "If 77 escapes, release 78 to bring it back."`,`THAW PROTOCOL: "All pods open in the event of a full escape attempt."`,`BIRTH RECORD: Subject 77 — real name redacted. Parents: "Employees, deceased".`,`A family photo frozen in ice. One of the faces looks a lot like yours.`,`COOLANT MAINTENANCE: "Keep the Reactor below 40%. Above that, the vault melts."`,`DIRECTOR MEMO: "Subject 77 belongs to the Syndicate. Its blood is worth billions."`,`An empty pod with a little name scratched inside: "I want to go home."`,`DOC ON THE RADIO: "Your parents worked here, 77. I knew them. I'm sorry."`,`SECURITY ALERT: Subject 78 has left its pod.`],beats:{1:`The Cryo Vault. Rows and rows of frozen subjects. Pod 77 is open… you were kept here for years.`,20:`You find out the truth: your parents worked at Helix. They hid you here to keep you safe from the Syndicate.`,38:`Pod 78 is empty. Something made from your own cells is now loose — and it is hunting you.`,50:`The Vault Core. Subject 78 is waiting. It moves like you, it thinks like you… but it is pure mutant.`},bosses:[`Frostbite`,`The Icicle Twins`,`Coolant Crawler`,`The Thawed Giant`,`SUBJECT 78`]},{n:6,name:`Reactor Core`,color:`#ff8a2a`,theme:`reactor`,blurb:`The Syndicate's power source. Their plan, Operation Green Dawn, needs it at full power.`,places:[`Turbine Hall`,`Control Room`,`Fuel Rod Store`,`Cooling Tower`,`Steam Pipes`,`Generator Floor`,`Radiation Lab`,`Catwalks`,`Transformer Yard`,`Core Chamber`],situations:[`The heat is unbearable and the floor vibrates with every pulse of the reactor.`,`Warning lights spin orange. Everything is "OVERLOADING".`,`Steam bursts out of cracked pipes in scalding clouds.`,`Mutants here glow slightly. That's… not good.`,`Giant turbines spin so fast the air whistles.`,`Sparks rain down from the overloaded cables.`,`The control room alarms play a cheerful jingle. Nobody fixed it.`,`Fuel rods hum in their racks, bright green.`,`The catwalks sway above a very long drop.`,`A countdown on every screen: GREEN DAWN LAUNCH PREPARATION.`],files:[`ENGINEER'S LOG: "The Director wants 100% output. At 100% this place goes up like a firework."`,`GREEN DAWN SCHEDULE: "Reactor powers the launch. Launch seeds the clouds. Clouds rain on everyone."`,`VOSS AUDIO LOG: "I sabotaged the fuel valves. It buys us days, not weeks."`,`SAFETY MANUAL with every page marked "IGNORE".`,`POWER ROUTING: 90% → Orbital Launch Site. 10% → coffee machines.`,`MEMO: "Dr. Voss has been moved to Containment Omega for 're-education'."`,`DOC ON THE RADIO: "If we cut the reactor, the launch can't happen. Go for the core!"`,`A melted helmet with the name "Bruno" — the starship guard?`,`FAX: "Investors arriving Friday to watch the launch. Provide snacks."`,`A circuit diagram with one wire labelled "DO NOT CUT (seriously)".`,`LOG: "Subject 78 seen near the turbines, following 77's trail."`,`DIRECTOR'S NOTE: "Doc is a liability. Trace the radio signal."`],beats:{1:`The Reactor Core. Doc: "Shut this down and the Syndicate can't launch. But they'll throw everything at you."`,15:`Dr. Voss has been taken to Containment Omega. Doc says she's still alive.`,30:`You overload a turbine on purpose. Somewhere far above, a very angry Director spills their coffee.`,49:`The Core Chamber. A colossal reactor-fed mutant stands guard: "Meltdown".`},bosses:[`Sparky Pete`,`The Steam Beast`,`Rod-Eater`,`Turbine Tyrant`,`Meltdown`]},{n:7,name:`Containment Omega`,color:`#c43aff`,theme:`omega`,blurb:`Where the failed experiments are kept. The friendly voice on the radio knows the way. Too well.`,places:[`Intake Gate`,`Cell Ring 1`,`Observation Deck`,`Interrogation Suite`,`Cell Ring 2`,`Isolation Tanks`,`Psych Lab`,`Cell Ring 3`,`Warden Tower`,`Omega Pit`],situations:[`Purple warning lights pulse in time with a heartbeat sound.`,`The worst mutants are kept here — and the locks are failing one by one.`,`Observation windows are cracked from the inside.`,`Speakers play soothing whale noises. It is not working.`,`Every door has three locks and a sign saying "NO".`,`Mutants here wear numbered collars. Some have broken them.`,`The floor is a grid of glowing containment fields.`,`You hear Dr. Voss's voice echoing from somewhere deep below.`,`Restraints hang empty. Lots of them.`,`A mutant has written "HELP" in goo on the glass.`],files:[`INTAKE FORM: "Dr. M. Voss — reason: disloyalty. Treatment: Mutagen-X."`,`OBSERVATION LOG: "Voss resists the mutagen. Her research on 77 is protecting her."`,`RADIO TRACE: "The 'Doc' signal originates from… Executive Tower, Director's office."`,`VOSS NOTE (hidden in a vent): "77, the voice on the radio is NOT your friend."`,`COLLAR MANUAL: "Collared mutants obey the Director's frequency."`,`PSYCH REPORT on Subject 77: "Trusting. Will follow a friendly voice anywhere."`,`A drawing by Dr. Voss: you, as a child, holding her hand.`,`ORDER: "Lead 77 to the Orbital Site. Make it think it is escaping."`,`TANK LABEL: "OMEGA-1 — the first ever mutant. Do not feed. Do not look at."`,`EMERGENCY PLAN: "If Voss talks to 77, flood Omega with mutagen."`,`DOC ON THE RADIO: "Ignore the notes, 77. Keep going. Trust me."`,`Dr. Voss's ID badge, still warm.`],beats:{1:`Containment Omega — Doc guides you in. "Dr. Voss is down here. Go and get her!"`,14:`A hidden note from Dr. Voss: "The voice on the radio is NOT your friend." Your stomach drops.`,31:`You trace the radio signal. "Doc" is broadcasting from the Director's office. You've been led all along.`,46:`You find Dr. Voss in an isolation tank — alive! She whispers: "Get to the Tower. End this." Then the Omega guardian wakes.`},bosses:[`Collar-Breaker`,`The Watcher`,`Madame Mindbend`,`Tank Brute Omega-1`,`The Omega Warden`]},{n:8,name:`Executive Tower`,color:`#ffc93a`,theme:`tower`,blurb:`Glass offices at the top of Helix. The Director's files hold the truth about Subject 77.`,places:[`Lobby`,`Open-Plan Office`,`Meeting Room 4`,`Server Farm`,`Executive Gym`,`Rooftop Garden`,`Trophy Room`,`Accounts`,`Penthouse`,`Director's Office`],situations:[`Polished marble floors, fancy plants… and mutants in business suits.`,`Printers spit out endless copies of "GREEN DAWN — CONFIDENTIAL".`,`The office mutants are still sitting at their desks. Pretending to work.`,`A motivational poster says "TEAMWORK" over a picture of a mutant.`,`Lifts ding open and shut, empty — mostly.`,`The coffee machine has mutated and is making terrible coffee.`,`Golden Helix statues line the halls, each one uglier than the last.`,`Floor-to-ceiling windows show the whole facility far below.`,`A boardroom table is set for a celebration launch party.`,`The air conditioning plays smooth jazz. Constantly.`],files:[`BOARD MINUTES: "Green Dawn will make Helix the only company with the cure. We will sell it to the world."`,`PAYROLL: Dr. Voss — "terminated". Your parents — "terminated". Doc — "Director".`,`DIRECTOR'S DIARY: "77 is the only cure. Whoever owns 77 owns the planet."`,`INVESTOR SLIDES: page 1 — "Make everyone sick". Page 2 — "Sell them the cure". Page 3 — "Profit".`,`EMAIL: "Prepare the starship. 77 must be on board when we launch."`,`A trophy: "Employee of the Month — Subject 78". Creepy.`,`SECURITY CODES list — someone helpfully wrote them on a sticky note.`,`DIRECTOR'S DIARY: "Patient Zero is under the facility. It must never wake."`,`LAUNCH MANIFEST: "Cargo: 400L Mutagen-X, 12 crates pollen, 1× Subject 77 (sedated)."`,`A recording of Dr. Voss: "The cure must be FREE. For everyone."`,`An unsent letter from your parents: "We hid our child where no one would look."`,`DOC ON THE RADIO (no longer friendly): "Clever, 77. Come up to my office."`],beats:{1:`The Executive Tower. Every floor is closer to the Director — and the Director knows you're coming.`,13:`You learn the real plan: make the whole world sick, then sell them a cure made from YOUR blood.`,29:`Your parents' letter. They worked here, discovered the plan, and hid you in the Cryo Vault to protect you.`,50:`The Director's Office is empty — they've fled to the launch site. Their bodyguard, a mountain of muscle, blocks the door.`},bosses:[`The Intern`,`Middle Manager Max`,`The Accountant`,`Security Chief Granite`,`The Bodyguard`]},{n:9,name:`Orbital Launch Site`,color:`#5a6aff`,theme:`orbital`,blurb:`The Syndicate's starship is fuelled with mutagen. If it reaches orbit, the whole world goes green.`,places:[`Launch Gantry`,`Fuel Depot`,`Mission Control`,`Hangar 1`,`Crew Quarters`,`Cargo Lift`,`Engine Bay`,`Countdown Room`,`Docking Ring`,`Launch Pad`],situations:[`Rockets tower over the gantries and steam pours from the fuel lines.`,`A voice counts down from somewhere: "T-minus… still a while, actually."`,`Mutagen tanks are being loaded by mutant workers on forklifts.`,`Sirens wail as the launch doors begin to open.`,`Everything rumbles every time an engine test fires.`,`The starship's hull glows green with stored mutagen.`,`Space suits hang in rows. A few of them are moving.`,`Mission Control screens show a map of every city on Earth.`,`Strong winds howl across the open launch platforms.`,`The Director's voice booms: "Load Subject 77 the moment it is caught!"`],files:[`LAUNCH PLAN: "Reach orbit. Release pollen into the clouds. Wait one week."`,`FLIGHT CREW ROSTER: Pilot — Director. Co-pilot — Subject 78.`,`FUEL REPORT: "Mutagen tanks at 98%. One more batch and we fly."`,`VOSS MESSAGE (smuggled): "77, there are escape pods on the starship. Use them."`,`ENGINEER NOTE: "The starship cannot launch with the cargo bay open."`,`A child's rocket drawing labelled "ME GOING HOME" — yours, from years ago.`,`MISSION CONTROL LOG: "Subject 78 lost track of 77 in the hangars."`,`SECURITY NOTE: "Patient Zero's vault is directly beneath the launch pad."`,`INVESTOR EMAIL: "If the launch fails we're pulling out. And suing."`,`COUNTDOWN SCRIPT with every "abort" option deleted.`,`DIRECTOR AUDIO: "When the rocket goes, the vault below will crack. Let Patient Zero wake. It won't matter."`,`A cargo crate with your face on it, labelled "VALUABLE".`],beats:{1:`The Orbital Launch Site. A giant starship glows with stolen mutagen. You must stop it from ever leaving the ground.`,22:`You sabotage a fuel line. The countdown stalls — the Director screams over every speaker.`,37:`Subject 78 is now flying the starship's security systems. It knows every move you make.`,50:`The Launch Pad. The Director launches anyway. Subject 78 stands between you and the rocket — this ends now.`},bosses:[`Gantry Gremlin`,`Forklift Freddy`,`Mission Control Mike`,`The Hangar Horror`,`SUBJECT 78: FINAL FORM`]},{n:10,name:`Heart of Helix`,color:`#ff3a5a`,theme:`heart`,blurb:`Patient Zero waits at the bottom of everything. Only Subject 77 can end this.`,places:[`The Crack`,`Ancient Lab`,`Bone Gallery`,`Mutagen Spring`,`Fossil Vault`,`The Pulse Chamber`,`Root of Helix`,`The Archive`,`Zero's Cradle`,`The Heart`],situations:[`The launch cracked the ground open — beneath the facility is an older, stranger lab.`,`The walls pulse slowly, like something breathing.`,`Mutagen bubbles up from the floor in glowing springs.`,`Old Helix equipment from 50 years ago, covered in roots.`,`Giant bones line the halls. Some of them are still moving.`,`Every mutant here is ancient, huge and very, very grumpy.`,`Dr. Voss's voice on a real radio now: "I'm right behind you, 77."`,`The deeper you go, the louder the heartbeat.`,`Fossilised mutants are frozen mid-roar in the rock.`,`The air shimmers with green light.`],files:[`FOUNDER'S DIARY, 50 years old: "We found something in the ground. It changes everything it touches."`,`ANCIENT LAB REPORT: "Specimen 'Patient Zero' — source of all Mutagen-X."`,`VOSS RADIO: "Your antibodies can neutralise the source itself. You were always the cure."`,`FOUNDER'S LAST ENTRY: "If it ever wakes, only a body that the mutagen cannot touch can stop it."`,`A cave painting of a small figure standing in front of a giant green heart.`,`DIRECTOR'S BADGE, half buried in goo. The Director didn't make it.`,`Spring water sample: "Pure Mutagen-X. Do NOT drink." Good advice.`,`ARCHIVE INDEX: "Subjects 1–77 — all descended from Helix staff families."`,`VOSS RADIO: "Once Zero is gone, every mutant can be turned back. Everyone comes home."`,`A message from Subject 78, scratched on the wall: "I am sorry. I was made to hunt."`,`MAP: the Heart is three levels down. Then up, up and out.`,`A photo of your parents in this very room, smiling. They knew.`],beats:{1:`The launch failed — and cracked the earth open. Below the facility is something ancient. Dr. Voss joins you on the radio: "This is where it all began."`,25:`Subject 78 stops hunting you. It understands now. It was made to be you — and it chooses to help.`,40:`The Pulse Chamber. Every mutant in the facility is connected to the heartbeat below. Stop the heart, save them all.`,49:`One level left. Patient Zero is awake. Dr. Voss: "You were always the cure, 77. Go and finish it."`},bosses:[`The Fossil`,`Spring Serpent`,`The Bone Collector`,`Pulse Guardian`,`PATIENT ZERO`]}],Fr=e=>e%10==0,Ir=e=>Pr[Math.min(9,Math.floor((e-1)/50))];function Lr(e){let t=e*2654435761>>>0||1;return()=>(t^=t<<13,t>>>=0,t^=t>>17,t^=t<<5,t>>>=0,t/4294967296)}var Rr=[`elite`,`boss_brute`,`boss_hound`,`boss_queen`,`boss_abom`],zr=[`#ff4a4a`,`#4aa8ff`,`#5aff6a`,`#ffd23a`,`#c46aff`,`#ff8a2a`,`#5affff`,`#ff6ad8`,`#ffffff`,`#ff2a4a`];function Br(e){let t=Ir(e),n=Math.floor((e-1)%50/10),r=e/10-1,i=r/49;return{name:t.bosses[n],sprite:Rr[(n+t.n)%5],tint:zr[(t.n+n*3)%10],index:r,d:i,speed:.8+i*.17,vision:230+i*120,searchTime:4+i*5,grabTaps:Math.roun         <p><b>Mutants come in waves.</b> Roaming hordes sweep the map, and the moment you start a task the room's vents <b>swarm</b>. You can't work while you're mobbed — fight them off first.</p>
        <h4>➕ Med Bay</h4>
        <p>🎉 <b>Level twists</b>: some levels are a <b>🪩 Disco Night</b> (slow dancing mutants, double coins), a <b>💰 Gold Rush</b> (extra gems and a Golden Mutant) or a <b>⚡ Speed Surge</b> (everyone faster, double XP). 👑 A <b>Golden Mutant</b> sometimes appears and runs away — catch it for a big gem prize! 🛢️ <b>Red barrels</b> explode and chain. 🐾 A <b>lab critter</b> is often locked in a cage — free it and bring it to a launch pod for bonus gems. Kill streaks (5, 10, 20, 35 quick kills) pay out bonus coins. Tap the <b>minimap</b> for the full map, or 📋 for your tasks and tips.</p><p>Most levels have a <b>Med Bay</b> (red cross on the floor) with two <b>full-heal kits</b> inside. Walk in and you're <b>safe for 30 seconds</b> — mutants can't get in or hurt you. Leave whenever you like, but once the 30 s are up mutants can come in, and the bay takes <b>90 seconds</b> to recharge (and restock its kits). Small <b>+25% med kits</b> are scattered around the ship, and mutants sometimes drop one. Kits stay put until you're hurt.</p>
        <h4>🚀 Launch pods</h4>
        <p>When every objective is done, reach the Launch Bay. There are <b>3 pods</b> and on normal levels <b>1 is a trap</b> (a different one every game) — choose wisely! The trap seals the room and releases a <b>boss</b>. You get <b>50% health</b> back; beat the boss, then try another pod.</p>
        <h4>🔢 Codes, drains & lockers</h4>
        <p>Keypad codes are hidden in notes, terminals and riddles — they go in your 📓 journal. Wrong codes set off an alarm. <b>Drains</b> are tunnels (great for escaping) and often lead to a secret room. <b>Lockers</b> hide you.</p>
        <h4>💀 HARD levels (every 10th)</h4>
        <p>A boss hunts you across the map. It can't be killed — only stunned. If it grabs you, tap fast to break free. There's also a lockdown timer at the end.</p>
        <h4>⭐ Stars</h4><p>1 star for escaping, 1 for a fast time, 1 for no revive (and finding the secret room if there is one).</p>`,survival:`<h4>🧟 Survival — the ultimate test</h4>
        <p>Endless and brutal. Fast runners and dogs from the first second, lava spitters by 0:45, <b>a boss every 2 minutes</b> and extra hordes every minute. Healing gets rarer the longer you last.</p>
        <p><b>Don't stand still</b> — camping in one spot calls an ambush ring of dogs and a lava barrage.</p>
        <p>🛡️ There are <b>4 Bunkers</b> on the map, one in each direction (a green arrow points to the nearest when you're hurt). Walk in through the door: two <b>full-heal kits</b> lie on the floor, and for <b>30 seconds</b> mutants can't get in or hurt you. Leave whenever you like — but once the 30 s run out they can follow you inside, and that bunker takes <b>2 minutes</b> to recharge.</p><p>🏆 <b>Rounds</b>: like Zombies — each round has a set number of mutants arriving in groups from a direction you're warned about. Kill them all to end the round, then take a breather. Every round brings more mutants with <b>15% more health</b>, and every 5th round is a <b>boss round</b>. Two power-ups drop each round (often <b>Insta-Kill</b>).</p><p>☢ <b>Nuke</b>: after every 10th round a nuke drops nearby — reach it within <b>15 seconds</b> and the next round only has <b>half</b> its mutants.</p><p>🧱 <b>Cover</b>: sandbag walls, concrete barriers and wrecked cars block mutants and their spit, so fight from behind them — but they'll walk round the ends!</p><p>💡 <b>Blackouts</b>: from round 3 the lights can suddenly go out — you only see what your flashlight hits. Follow the yellow <b>POWER</b> arrow to the <b>Power Station</b> (south of the start). Its <b>bosses ambush you</b> when you arrive! Stand on the big switch to restore power: <b>3 s</b> once the bosses are beaten, <b>8 s</b> if they're still up. Each station boss is worth 150 scrap, and restoring power gives 60 more.</p><p>⚠️ <b>Healing has a price</b>: every time you enter a hiding pod or a bunker you <b>lose a power-up</b> (one of your level-up skills, at random). <b>Reviving</b> costs <b>3 power-ups</b> and resets <b>all</b> your Weapon Lab upgrades and power-up levels — you'll have to earn them again.</p><p>🟢 <b>Mutant Suit</b> power-up: BOOM — you burst into a big mutant disguise for 12 s. Mutants can't see you, and its shoulder launchers fire homing rockets at them.</p><p>🟣 <b>Hiding pods</b> drop in from <b>round 15</b>: step in to hide for <b>15 seconds</b> and recover <b>25% health</b> (move to jump out early). Each pod recharges after use.</p><p>➤ <b>Arrows</b> at the edge of the screen point to the Lab, the nearest bunker (HEAL), pods, the gun crate, supply crates and the nuke — they glow when you can afford something or need it.</p><p>🔧 <b>Weapon Lab</b> (just north of the start): mutants get <b>15% tougher every round</b>, so your gun slowly feels weaker. Mutants drop <b>⚙️ scrap</b> and each cleared wave gives a bonus — step onto the Lab's glowing pad (the game pauses) to evolve your gun: <b>Power Core</b> (+15% damage a level), <b>Rapid Loader</b> (faster firing), and <b>Explosive</b>, <b>Freezing</b> and <b>Electro Rounds</b>. A blue arrow points to the Lab whenever you can afford an upgrade.</p>
        <p>🟢 Watch out for <b>sticky green goo</b> on the ground — it slows you right down. Supply crates and the odd mutant drop <b>health</b>; grab it when you can.</p>
        <h4>🏆 Score</h4>
        <p><b>Every mutant kill = 10 points.</b> Bosses are 12,000, elites 2,000, and time survived adds more and more (it grows faster the longer you last). Trophies at 100,000, 250,000 and 500,000.</p>
        <p>Reach <b>1,000,000 points</b> in one run to unlock the one-of-a-kind <b>Mayhem Millionaire</b> outfit. Expect it to take around 30 minutes of near-perfect play.</p>`,weapons:`<h4>🔫 Your main gun</h4>
        <p>Equip one of 30 guns in <b>Gear → Guns</b>. Each class plays differently: pistols, shotguns, rifles, machine guns, snipers, energy weapons, experimental weapons and specials. The <b>RAY GUN</b> (💎1,000,000) is the best by far.</p>
        <h4>🎰 Weapons Crate (in every match)</h4>
        <p>Pay <b>coins</b> to spin for a random gun for that match. Keep it, spin again or walk away. Only your <b>first</b> spin slows the mutants down.</p>
        <h4>🎡 Weapon Spin (Store)</h4>
        <p>💎500 a spin to win a gun <b>for keeps</b> — anything up to the Fireworks Launcher. Big guns are rare (the odds are listed). If you already own what you win, you get coins instead.</p>`,powers:`<h4>⚡ Power-ups</h4><p>They're rare — grab them when you see them. Run through one to use it.</p>
        <div class="glist">${Object.entries(Be).map(([e,t])=>`<div><img src="${this.icon(`pu_`+e)||``}"><b style="color:${t.color}">${t.name}</b><span>${t.desc}${t.dur?` · ${t.dur}s`:``}</span></div>`).join(``)}</div>`,mutants:`<h4>🧟 Know your enemy</h4><div class="glist">${[[`walker`,`Walker`,`Slow and steady. Dangerous in crowds.`],[`runner`,`Runner`,`Fast and twitchy — never let them flank you.`],[`crawler`,`Crawler`,`Low to the ground and tough to spot in the dark.`],[`dog`,`Mutant Dog`,`The fastest mutant. Packs hunt you down.`],[`fatty`,`Bloater`,`Huge health; shoves smaller mutants out of the way.`],[`spitter`,`Spitter`,`Spits toxic goo from range — keep moving.`],[`lava`,`Lava Spitter`,`Lobs mutant lava. A circle shows where it lands, then it leaves a burning pool.`],[`bomber`,`Bomber`,`Runs at you and explodes. Shoot it early!`],[`ghoul`,`Ghoul`,`Late-game hunter: fast and tough.`],[`elite`,`Elite Brute`,`Massive health. Drops a chest with upgrades when beaten.`]].map(([e,n,r])=>`<div><img src="${t(e)}"><b>${n}</b><span>${r}</span></div>`).join(``)}</div>
        <p>Bosses (Brute, Hound, Queen, Abomination) appear in Survival and on HARD levels. Watch for their charge and slam attacks.</p>`,money:`<h4>💎 Gems</h4>
        <p>Earned by playing: <b>+125 gems for every new Escape level you pass</b> (+31 on replays) — v1.1 boosted every gem you earn by 25%, gems you pick up, secret rooms, relics, bosses, Survival scores and achievements.</p>
        <p>Spend gems on: <b>outfits & cosmetics, weapons, gear chests, the Season Pass (💎1,000), Weapon Spins and coin packs</b>. Check the <b>Daily Sale</b> in the Store for up to 75% off.</p>
        <h4>🪙 Coins</h4>
        <p>Earned in every match. Spend them on everything else: the in-match <b>Weapons Crate</b>, <b>energy refills</b>, <b>Training</b>, <b>revives</b> and supply-room doors.</p>
        <h4>🏋️ Training</h4><p>Seven training skills (ATK, HP, defence, healing, pickup range, coins and XP) that you level up again and again with coins. Each level costs a bit more and some need a higher player level.</p>
        <h4>🎟️ Season Pass</h4><p>💎1,000. A new season every month with 100 reward tiers — outfits, 3 season weapons, gems, coins and more. Earn pass XP by playing. <b>Everyone gets a free gift every 5 tiers</b>, even without the pass.</p><h4>🔁 Coins → gems</h4><p>In Store → Supplies you can swap coins for gems — it's expensive on purpose (1,000 gems = 50,000 coins).</p>
        <h4>🎡 Daily Spin</h4><p>One free spin every day: energy, coins, gems and gear up to <b>Legendary</b>.</p>`,saving:`<h4>💾 Saving</h4>
